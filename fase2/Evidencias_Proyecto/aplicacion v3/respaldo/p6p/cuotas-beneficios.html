<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proyecto SEIS - Cuotas Sociales</title>
    
    <!-- BLOQUEO DE EXENTOS - EJECUTAR PRIMERO -->
    <script>
        (function() {
            const bomberoId = localStorage.getItem('bomberoCuotasActual');
            if (!bomberoId) return;
            
            const bomberos = JSON.parse(localStorage.getItem('bomberos')) || [];
            const bombero = bomberos.find(b => b.id == bomberoId);
            if (!bombero) return;
            
            // Calcular años de servicio
            const fechaIngreso = new Date(bombero.fechaIngreso);
            const hoy = new Date();
            const añosServicio = (hoy - fechaIngreso) / (365.25 * 24 * 60 * 60 * 1000);
            
            let categoria = 'Activo';
            if (añosServicio >= 30) categoria = 'Honorario';
            else if (añosServicio >= 25) categoria = 'Insigne de 25 Años';
            
            const estadoBombero = bombero.estadoBombero || 'activo';
            const estaExento = categoria === 'Honorario' || categoria === 'Insigne de 25 Años' || estadoBombero === 'martir';
            
            if (estaExento) {
                document.write(`
                    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; font-family: Arial; background: #f5f5f5;">
                        <h1 style="color: #f44336; font-size: 72px; margin: 0;">❌</h1>
                        <h2 style="color: #333;">Acceso Denegado</h2>
                        <p style="font-size: 20px; color: #666;">Este voluntario es <strong style="color: #f44336;">${categoria}</strong></p>
                        <p style="font-size: 18px; color: #666;">NO debe pagar cuotas sociales.</p>
                        <p style="color: #999; margin-top: 40px;">Redirigiendo en 3 segundos...</p>
                    </div>
                `);
                setTimeout(() => window.location.href = 'sistema.html', 3000);
                throw new Error('stop');
            }
        })();
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="css/global-profesional.css">
    <link rel="stylesheet" href="css/cuotas.css">
    <link rel="stylesheet" href="css/tema-bomberil.css">
</head>
<body>
    <div class="page-container cuotas-page">
        <div class="container">
            <div class="page-header cuotas-header">
                <h2>💳 SISTEMA DE CUOTAS SOCIALES</h2>
                <p>Control de Pagos Mensuales</p>
            </div>

            <div class="page-content">
                <div id="mensajeCuotas" class="mensaje-global" style="display: none;"></div>

                <!-- Información del Bombero -->
                <div class="bombero-info">
                    <h3>Información del Voluntario</h3>
                    <div class="bombero-datos" id="bomberoDatosCuotas"></div>
                    
                    <!-- Botones de Acción -->
                    <div style="display: flex; gap: 10px; margin-top: 15px; justify-content: center; flex-wrap: wrap;">
                        <button type="button" class="btn btn-pdf" onclick="cuotasSistema.generarPDFDeudas()" title="Generar PDF con estado de deudas">
                            📄 PDF Deudas
                        </button>
                        <button type="button" class="btn btn-excel" onclick="cuotasSistema.exportarExcel()" title="Exportar a Excel">
                            📊 Exportar Excel
                        </button>
                        <button type="button" class="btn btn-secondary" onclick="cuotasSistema.volverAlSistema()">
                            ⬅️ Volver
                        </button>
                    </div>
                </div>

                <!-- Formulario Cuota Social -->
                <div class="form-container">
                    <h3>💰 Registrar Pago de Cuota Social</h3>
                    
<form id="formCuotaSocial">
    <input type="hidden" id="bomberoCuotaId" name="bomberoCuotaId">
    
    <div class="form-grid">
        <div class="form-group">
            <label for="tipoCuota" class="required">Tipo de Cuota</label>
            <select id="tipoCuota" name="tipoCuota" required onchange="cuotasSistema.cambioTipoCuota()">
                <option value="">Seleccione tipo</option>
                <option value="regular">Cuota Regular - $5.000</option>
                <option value="estudiante">Cuota Estudiante - $3.000</option>
            </select>
        </div>

        <div class="form-group">
            <label for="anioCuota" class="required">Año</label>
            <input type="number" id="anioCuota" name="anioCuota" required 
                   min="2020" max="2030" value="2025">
        </div>

        <div class="form-group">
            <label for="fechaPagoCuota" class="required">Fecha de Pago</label>
            <input type="date" id="fechaPagoCuota" name="fechaPagoCuota" required>
        </div>
        <div class="form-group">
    <label for="formaPagoCuota" class="required">Forma de Pago</label>
    <select id="formaPagoCuota" name="formaPagoCuota" required>
        <option value="">Seleccione forma de pago</option>
        <option value="Efectivo">💵 Efectivo</option>
        <option value="Transferencia">🏦 Transferencia Bancaria</option>
        <option value="Depósito">🏧 Depósito</option>
        <option value="Tarjeta">💳 Tarjeta</option>
        <option value="Cheque">📝 Cheque</option>
    </select>
</div>

<div class="form-group full-width">
    <label for="comprobanteCuota" class="opcional">Comprobante de Pago (Imagen/PDF)</label>
    <input type="file" 
           id="comprobanteCuota" 
           name="comprobanteCuota" 
           accept="image/*,application/pdf"
           onchange="cuotasSistema.previsualizarComprobante(this)">
    <div id="previewComprobanteCuota" class="previsualizacion-archivo"></div>
</div>

        <!-- CHECKBOXES DE MESES -->
        <div class="form-group full-width">
            <label class="required">Seleccione los meses a pagar</label>
            <div class="meses-checkbox-grid">
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="1">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Enero</span>
                </label>
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="2">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Febrero</span>
                </label>
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="3">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Marzo</span>
                </label>
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="4">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Abril</span>
                </label>
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="5">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Mayo</span>
                </label>
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="6">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Junio</span>
                </label>
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="7">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Julio</span>
                </label>
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="8">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Agosto</span>
                </label>
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="9">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Septiembre</span>
                </label>
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="10">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Octubre</span>
                </label>
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="11">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Noviembre</span>
                </label>
                <label class="checkbox-mes">
                    <input type="checkbox" name="meses" value="12">
                    <span class="checkbox-custom">✓</span>
                    <span class="mes-label">Diciembre</span>
                </label>
            </div>
            <div class="meses-seleccionados-info">
                <strong>Total a pagar:</strong> <span id="totalAPagar">$0</span>
            </div>
        </div>

        <div class="form-group full-width">
            <label for="observacionesCuota" class="opcional">Observaciones</label>
            <textarea id="observacionesCuota" name="observacionesCuota" rows="2" 
                      placeholder="Observaciones adicionales (opcional)"></textarea>
        </div>
    </div>

    <div class="buttons">
        <button type="submit" class="btn btn-cuota">✅ Registrar Pago de Cuota(s)</button>
        <button type="button" class="btn btn-secondary" onclick="cuotasSistema.limpiarFormulario()">Limpiar</button>
    </div>
</form>
                </div>

                <!-- ============ SELECTOR DE AÑOS (NUEVO) ============ -->
                <div id="selectorAñosContainer">
                    <!-- Se genera dinámicamente por JavaScript -->
                </div>
                <!-- ================================================== -->

                <!-- Grid de Meses -->
                <div class="cuotas-grid">
                    <h3>📊 Estado de Cuotas del Año <span id="anioActualCuotas">2025</span></h3>
                    <div id="gridMesesCuotas" class="meses-grid"></div>
                </div>

                <!-- Historial de Cuotas -->
                <div class="list-container">
                    <div class="list-header">
                        <h3>📚 Historial de Pagos de Cuotas</h3>
                        <button type="button" class="btn btn-excel" onclick="cuotasSistema.exportarExcel()">
                            📊 Descargar Excel
                        </button>
                    </div>
                    
                    <div class="contador">
                        Total de pagos: <strong id="totalPagosCuotas">0</strong>
                    </div>
                    
                    <div id="listaCuotas" class="lista-items"></div>
                </div>

                <div class="navigation-buttons">
                    <button type="button" class="btn btn-volver" onclick="cuotasSistema.volverAlSistema()">
                        ← Regresar al Sistema Principal
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    
    <!-- VERIFICACIÓN DE EXENCIÓN ANTES DE CARGAR EL SISTEMA -->
    <script>
        (function() {
            const bomberoId = localStorage.getItem('bomberoCuotasActual');
            if (!bomberoId) return;
            
            const bomberos = JSON.parse(localStorage.getItem('bomberos')) || [];
            const bombero = bomberos.find(b => b.id == bomberoId);
            
            if (!bombero) return;
            
            // Calcular categoría
            const fechaIngreso = new Date(bombero.fechaIngreso);
            const hoy = new Date();
            const añosServicio = (hoy - fechaIngreso) / (365.25 * 24 * 60 * 60 * 1000);
            
            let categoria = 'Voluntario';
            if (añosServicio >= 50) categoria = 'Voluntario Insigne de Chile';
            else if (añosServicio >= 25) categoria = 'Voluntario Honorario del Cuerpo';
            else if (añosServicio >= 20) categoria = 'Voluntario Honorario de Compañía';
            
            const estadoBombero = bombero.estadoBombero || 'activo';
            const tieneCuotasActivas = bombero.cuotasActivas !== false;
            const esHonorarioCompania = categoria === 'Voluntario Honorario de Compañía';
            const esHonorarioCuerpo = categoria === 'Voluntario Honorario del Cuerpo';
            const esInsigne = categoria === 'Voluntario Insigne de Chile';
            const esMartir = estadoBombero === 'martir';
            
            // Solo bloquear si es exento Y no tiene cuotas activadas
            if ((esHonorarioCompania || esHonorarioCuerpo || esInsigne || esMartir) && !tieneCuotasActivas) {
                // BLOQUEAR TOTALMENTE
                document.body.innerHTML = `
                    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; font-family: Arial; background: #f5f5f5;">
                        <h1 style="color: #f44336; font-size: 72px; margin: 0;">❌</h1>
                        <h2 style="color: #333; margin-top: 20px;">Acceso Denegado a Cuotas</h2>
                        <p style="font-size: 20px; color: #666; margin: 10px 0;">Este voluntario es <strong style="color: #f44336;">${categoria}</strong></p>
                        <p style="font-size: 18px; color: #666;">Los ${categoria}s <strong>NO pagan cuotas sociales</strong>.</p>
                        <p style="color: #999; margin-top: 40px; font-size: 14px;">Redirigiendo en 3 segundos...</p>
                    </div>
                `;
                setTimeout(() => window.location.href = 'sistema.html', 3000);
                throw new Error('Acceso denegado'); // Detener ejecución de scripts siguientes
            }
        })();
    </script>
    
    <script src="js/cuotas.js"></script>
</body>
</html>
