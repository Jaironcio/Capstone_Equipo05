<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Asistencias - Sistema Bomberos</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="css/sistema.css">
    <link rel="stylesheet" href="css/asistencias-cargos.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
        }

        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1rem;
            opacity: 0.95;
        }

        .volver-btn {
            position: absolute;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .volver-btn:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-50%) scale(1.05);
        }

        .content {
            padding: 30px;
        }

        /* ESTADÍSTICAS GENERALES */
        .estadisticas-generales {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .stat-value {
            font-size: 3rem;
            font-weight: 700;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        /* BOTONES DE ACCIÓN */
        .action-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(196, 30, 58, 0.3);
        }

        .btn-success {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-secondary {
            background: linear-gradient(135deg, #9e9e9e 0%, #616161 100%);
            color: white;
            box-shadow: 0 5px 15px rgba(158, 158, 158, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        /* LAYOUT PRINCIPAL: RANKING + EMERGENCIAS */
        .main-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        /* RANKING DE ASISTENCIAS */
        .ranking-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            border: 2px solid #e0e0e0;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .ranking-header {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #8b4513;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.3);
        }

        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ranking-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 10px;
            transition: all 0.3s;
            border-left: 4px solid transparent;
        }

        .ranking-item:hover {
            background: #fff;
            border-left-color: #c41e3a;
            transform: translateX(5px);
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        }

        .ranking-position {
            font-size: 1.5rem;
            font-weight: 700;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .ranking-item:nth-child(1) .ranking-position {
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            color: #8b4513;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.4);
        }

        .ranking-item:nth-child(2) .ranking-position {
            background: linear-gradient(135deg, #c0c0c0 0%, #e8e8e8 100%);
            color: #555;
        }

        .ranking-item:nth-child(3) .ranking-position {
            background: linear-gradient(135deg, #cd7f32 0%, #e8a870 100%);
            color: #fff;
        }

        .ranking-item:nth-child(n+4) .ranking-position {
            background: #e0e0e0;
            color: #666;
        }

        .ranking-info {
            flex: 1;
        }

        .ranking-nombre {
            font-weight: 600;
            font-size: 0.95rem;
            color: #333;
            margin-bottom: 3px;
        }

        .ranking-clave {
            font-size: 0.75rem;
            color: #999;
            font-family: 'Courier New', monospace;
        }

        .ranking-asistencias {
            font-weight: 700;
            color: #c41e3a;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        /* EMERGENCIAS */
        .emergencias-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            border: 2px solid #e0e0e0;
            max-height: 800px;
            overflow-y: auto;
        }

        .emergencias-header {
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            color: white;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-weight: 700;
            font-size: 1.2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .emergencias-lista {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* CARD DE EMERGENCIA - MÁS PEQUEÑA */
        .emergencia-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .emergencia-card:hover {
            border-color: #c41e3a;
            box-shadow: 0 5px 20px rgba(196, 30, 58, 0.15);
        }

        .emergencia-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f0f0f0;
        }

        .emergencia-fecha {
            font-size: 1.2rem;
            font-weight: 700;
            color: #c41e3a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .emergencia-hora {
            background: rgba(196, 30, 58, 0.1);
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            color: #c41e3a;
            font-size: 0.9rem;
        }

        .badge-stats {
            background: linear-gradient(135deg, #4caf50 0%, #2e7d32 100%);
            color: white;
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .emergencia-body {
            display: grid;
            gap: 10px;
        }

        .info-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 10px;
            padding: 8px 0;
            border-bottom: 1px solid #f5f5f5;
            font-size: 0.9rem;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .info-label {
            font-weight: 600;
            color: #666;
        }

        .info-value {
            color: #333;
        }

        /* ASISTENTES EN GRID COMPACTO */
        .asistentes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .asistente-item {
            padding: 8px 10px;
            background: rgba(196, 30, 58, 0.05);
            border-left: 3px solid #c41e3a;
            border-radius: 6px;
            font-size: 0.85rem;
            transition: all 0.3s;
        }

        .asistente-item:hover {
            background: rgba(196, 30, 58, 0.1);
            transform: translateX(3px);
        }

        .asistente-nombre {
            font-weight: 600;
            color: #333;
        }

        .asistente-cargo {
            color: #ff9800;
            font-weight: 600;
            font-size: 0.8rem;
            margin-left: 5px;
        }

        .asistente-clave {
            font-size: 0.75rem;
            color: #666;
            font-family: 'Courier New', monospace;
        }

        /* SCROLLBAR PERSONALIZADO */
        .emergencias-container::-webkit-scrollbar {
            width: 10px;
        }

        .emergencias-container::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        .emergencias-container::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #c41e3a 0%, #8b0000 100%);
            border-radius: 10px;
        }

        .emergencias-container::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(135deg, #8b0000 0%, #c41e3a 100%);
        }

        /* ESTADO VACÍO */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state-text {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* RESPONSIVE */
        @media (max-width: 1200px) {
            .main-layout {
                grid-template-columns: 1fr;
            }

            .ranking-container {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5rem;
            }

            .volver-btn {
                position: static;
                transform: none;
                margin-bottom: 15px;
                display: block;
            }

            .action-buttons {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .estadisticas-generales {
                grid-template-columns: 1fr;
            }

            .asistentes-grid {
                grid-template-columns: 1fr;
            }

            .emergencias-container {
                max-height: 600px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- HEADER -->
        <div class="header">
            <a href="sistema.html" class="volver-btn">← Volver</a>
            <h1>📊 HISTORIAL DE ASISTENCIAS A EMERGENCIAS</h1>
            <p>Registro Completo de Todas las Emergencias Atendidas</p>
        </div>

        <!-- CONTENIDO -->
        <div class="content">
            
            <!-- ESTADÍSTICAS GENERALES -->
            <div class="estadisticas-generales">
                <div class="stat-card">
                    <div class="stat-label">Total de Emergencias</div>
                    <div class="stat-value" id="totalEmergencias">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Asistencias Totales</div>
                    <div class="stat-value" id="totalAsistentesHistorico">0</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Promedio de Asistencia</div>
                    <div class="stat-value" id="promedioAsistencia">0%</div>
                </div>
            </div>

            <!-- BOTONES DE ACCIÓN -->
            <div class="action-buttons">
                <button onclick="window.location.href='registro-asistencia.html'" class="btn btn-primary">
                    + Nueva Asistencia
                </button>
                <button onclick="historialAsistencias.exportarExcel()" class="btn btn-success">
                    📊 Exportar a Excel
                </button>
                <button onclick="window.location.href='sistema.html'" class="btn btn-secondary">
                    ← Volver
                </button>
            </div>

            <!-- LAYOUT PRINCIPAL: RANKING + EMERGENCIAS -->
            <div class="main-layout">
                
                <!-- RANKING DE ASISTENCIAS -->
                <div class="ranking-container">
                    <div class="ranking-header">
                        🏆 TOP 10 VOLUNTARIOS
                    </div>
                    <div id="rankingLista" class="ranking-list">
                        <!-- Se llena dinámicamente -->
                    </div>
                </div>

                <!-- LISTA DE EMERGENCIAS (ÚLTIMAS 10) -->
                <div class="emergencias-container">
                    <div class="emergencias-header">
                        <span>🔥 Últimas 10 Emergencias</span>
                        <span id="contadorEmergencias" class="badge-stats">0 registros</span>
                    </div>
                    <div id="asistenciasContainer" class="emergencias-lista">
                        <!-- Se llena dinámicamente -->
                    </div>
                    <div id="emptyState" class="empty-state" style="display: none;">
                        <div class="empty-state-icon">📋</div>
                        <div class="empty-state-text">No hay asistencias registradas</div>
                        <button onclick="window.location.href='registro-asistencia.html'" class="btn btn-primary">
                            + Registrar Primera Asistencia
                        </button>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- LIBRERÍA PARA EXPORTAR A EXCEL -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- SCRIPTS -->
    <script src="js/auth.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/historial-asistencias.js"></script>
</body>
</html>
